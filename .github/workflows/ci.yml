name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the pinned radio app
        run: npm run build:app

      - name: Run the complete test suite
        run: npm test

      - name: Upload verified radio app
        uses: actions/upload-artifact@v4
        with:
          name: SpectrumLink-app-${{ github.sha }}
          path: dist/SpectrumLink.app
          if-no-files-found: error
          retention-days: 14
