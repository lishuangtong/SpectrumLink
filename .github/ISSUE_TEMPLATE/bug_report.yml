name: Bug 报告
description: 报告可重复的软件、界面、串口或实机问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请区分演示模式、实机结果和推测；不要上传呼号以外的个人信息、密钥或未公开漏洞。
  - type: dropdown
    id: area
    attributes:
      label: 问题区域
      options:
        - K1 实机 / USB 串口
        - 频谱 / 瀑布图 / S 表
        - ADS-B / 飞机模型 / 地形
        - 布局 / 多语言 / 设置
        - 构建 / 安装 / 其他
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SpectrumLink 版本
      placeholder: v3.7.7
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从启动开始逐步写出操作和频率/跨度设置。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果与实际结果
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境与实机状态
      description: 操作系统、浏览器版本、K1 型号、F4HWN Labs 版本；若未实机验证请明确说明。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 截图、诊断 JSON 或日志
      description: 请先删除个人路径、串口序列号和其他敏感信息。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue，没有找到相同问题。
          required: true
        - label: 这不是需要私下报告的安全漏洞。
          required: true
